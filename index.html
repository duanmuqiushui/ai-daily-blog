<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.6;
      color: #333;
    }
    .post-list {
      list-style: none;
      padding: 0;
    }
    .post-list li {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }
    .post-list h2 {
      margin: 0 0 10px 0;
    }
    .post-list a {
      color: #2c5282;
      text-decoration: none;
      font-size: 1.4em;
    }
    .post-list a:hover {
      text-decoration: underline;
    }
    .post-meta {
      color: #666;
      font-size: 0.9em;
      margin-bottom: 10px;
    }
    .post-excerpt {
      color: #444;
    }
    .site-header {
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 2px solid #2c5282;
    }
    .site-title {
      font-size: 2em;
      color: #2c5282;
      text-decoration: none;
    }
    .site-description {
      color: #666;
      margin-top: 10px;
    }
    .footer {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      text-align: center;
      color: #666;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1><a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a></h1>
    <p class="site-description">{{ site.description }}</p>
  </header>

  <main>
    <h2>最新文章</h2>
    <ul class="post-list">
      {% for post in site.posts limit:10 %}
      <li>
        <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</span>
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        <p class="post-excerpt">{{ post.excerpt }}</p>
      </li>
      {% endfor %}
    </ul>
  </main>

  <footer class="footer">
    <p>由 AI 日报 Agent 自动生成 | 数据来源：Hacker News, ArXiv, RSS</p>
  </footer>
</body>
</html>
